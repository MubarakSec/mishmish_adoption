<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مشمش — Project Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#FF6B6B;--teal:#4ECDC4;--yellow:#FFD93D;--cream:#FFF7ED;--dark:#111;--muted:#636E72}
html{scroll-behavior:smooth}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--cream);color:var(--dark);overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}.ar{font-family:'Noto Naskh Arabic',serif}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#FF6B6B55;border-radius:8px}
.glass{backdrop-filter:blur(16px);background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.06)}
.card{border-radius:20px;background:white;border:1px solid rgba(0,0,0,.06);box-shadow:0 8px 32px rgba(0,0,0,.06)}
.pill{border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn{border-radius:999px;padding:12px 22px;font-weight:700;border:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:.2s}
.btn-pink{background:var(--pink);color:white}.btn-pink:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,107,107,.35)}
.btn-ghost{background:white;border:1px solid rgba(0,0,0,.08)}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.6}
.paws{position:fixed;inset:0;pointer-events:none;opacity:.04;background-image:radial-gradient(circle at 2px 2px, var(--pink) 2px, transparent 0);background-size:32px 32px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes drift{0%{transform:translateY(-20vh) rotate(0deg);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(110vh) rotate(20deg);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.phone{width:260px;height:540px;border-radius:36px;background:#111;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.2), inset 0 0 0 2px #222;position:relative}
.phone-notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:22px;background:#111;border-radius:0 0 14px 14px;z-index:2}
.phone-screen{width:100%;height:100%;border-radius:28px;overflow:hidden;background:white;position:relative;display:flex;flex-direction:column}
@media(max-width:860px){
  .hero{grid-template-columns:1fr !important}
  .two{grid-template-columns:1fr !important}
  .three{grid-template-columns:1fr !important}
  .explorer{grid-template-columns:1fr !important}
  nav{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="paws"></div>
<div id="root"></div>

      ].map(t=>(
        <div key={t.id} className="card" style={{overflow:'hidden'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 14px',borderBottom:'1px solid #eee',background:'#FAFAF9'}}><span style={{fontWeight:800,fontSize:13}}>{t.title}</span><button onClick={()=>copy(t.copy,t.id)} style={{fontSize:12,padding:'6px 10px',borderRadius:999,border:'1px solid #ddd',background:copied===t.id?'#DCFCE7':'white',cursor:'pointer'}}>{copied===t.id?'✓ copied':'⧉ copy'}</button></div>
          <div style={{background:'#0B0B0B',color:'#E5E7EB',padding:14,minHeight:140}}>{t.lines.map((l,i)=>(<div key={i} className="mono" style={{fontSize:12,opacity:l.startsWith('$')?1:.75,color:l.includes('✓')?'#86EFAC':l.startsWith('$')?'#93C5FD':'#E5E7EB'}}>{l}</div>))}</div>
        </div>
      ))}
    </section>

    <section id="files" style={{maxWidth:1100,margin:'18px auto',padding:'0 16px'}}>
      <div style={{display:'flex',alignItems:'end',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}><h2 style={{fontSize:28,letterSpacing:'-0.02em'}}>File Explorer <span style={{opacity:.5,fontWeight:400}}>— اضغط أي ملف</span></h2><span className="mono" style={{fontSize:12,opacity:.6}}>{FILES.length} files · interactive</span></div>
      <div className="card explorer" style={{marginTop:12,display:'grid',gridTemplateColumns:'320px 1fr',minHeight:520,overflow:'hidden'}}>
        <div style={{borderRight:'1px solid #eee',background:'#FAFAF9',overflow:'auto',maxHeight:600}}>
          <div style={{padding:'12px 12px 8px',fontSize:11,letterSpacing:'.08em',opacity:.5,fontWeight:800}}>EXPLORER</div>
          <div style={{padding:'6px 8px',fontSize:12,opacity:.6}}>📁 mishmish / mishmish-api</div>
          {FILES.map(f=>(
            <button key={f.id} onClick={()=>setActive(f.id)} style={{width:'100%',textAlign:'left',display:'flex',gap:10,alignItems:'center',padding:'10px 12px',background:active===f.id?'white':'transparent',borderLeft:active===f.id?`3px solid ${f.color}`:'3px solid transparent',borderTop:'none',borderRight:'none',borderBottom:'1px solid #f0f0f0',cursor:'pointer'}}>
              <span style={{width:28,height:28,borderRadius:8,background:`${f.color}18`,display:'grid',placeItems:'center',fontSize:14}}>{f.icon}</span>
              <span style={{flex:1,minWidth:0}}><div className="mono" style={{fontSize:11,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',fontWeight:700}}>{f.path.split('/').pop()}</div><div style={{fontSize:11,opacity:.6}}>{f.lines} lines</div></span>
              <span style={{fontSize:10,opacity:.4}}>›</span>
            </button>
          ))}
        </div>
        <div style={{padding:18,overflow:'auto',background:'white'}}>
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}><span style={{width:36,height:36,borderRadius:12,background:`${activeFile.color}18`,display:'grid',placeItems:'center',fontSize:18}}>{activeFile.icon}</span><div><div className="mono" style={{fontWeight:800,fontSize:13}}>{activeFile.path}</div><div style={{fontSize:13,opacity:.7}}>{activeFile.desc} · <span className="mono">{activeFile.lines} lines</span></div></div><span className="pill" style={{marginLeft:'auto',background:`${activeFile.color}18`,color:activeFile.color,border:`1px solid ${activeFile.color}30`}}>{activeFile.fns.length} functions</span></div>
          <div style={{marginTop:14,display:'grid',gap:10}}>{activeFile.fns.map(fn=>(
            <div key={fn.n} className="card" style={{padding:12,display:'grid',gridTemplateColumns:'1fr auto',gap:10,alignItems:'center'}}>
              <div><div className="mono" style={{fontWeight:800,fontSize:13}}>{fn.n} <span style={{fontWeight:400,opacity:.6}}>— {fn.d}</span></div><div className="mono" style={{marginTop:6,background:'#0B0B0B',color:'#A7F3D0',padding:'7px 10px',borderRadius:10,fontSize:11,overflow:'auto'}}>{fn.c}</div></div>
              <div style={{width:44,height:44,borderRadius:12,background:`${activeFile.color}12`,display:'grid',placeItems:'center',fontSize:18}}>⚡</div>
            </div>
          ))}</div>
        </div>
      </div>
    </section>

    <section id="screens" style={{maxWidth:1100,margin:'18px auto',padding:'0 16px'}}>
      <div className="card" style={{padding:18}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}><h2 style={{fontSize:24}}>Screen Flow — الرحلة الكاملة</h2><div style={{display:'flex',gap:6}}>{[0,1,2,3,4,5,6].map(i=>(<button key={i} onClick={()=>setPhoneIdx(i)} style={{width:10,height:10,borderRadius:999,border:'none',background:phoneIdx===i?'#FF6B6B':'#E5E7EB',cursor:'pointer'}}/>))}</div></div>
        <div style={{marginTop:14,display:'grid',gridTemplateColumns:'300px 1fr',gap:16,alignItems:'center'}} className="two">
          <div style={{display:'grid',placeItems:'center'}}><div className="phone" style={{width:280,height:560}}><div className="phone-notch"/><div className="phone-screen"><PhonePreview idx={phoneIdx} large={true}/></div></div></div>
          <div>
            <FlowSteps idx={phoneIdx} setIdx={setPhoneIdx}/>
            <div style={{marginTop:12,display:'flex',gap:8}}><button className="btn btn-ghost" onClick={()=>setPhoneIdx(i=> (i+6)%7)} style={{cursor:'pointer'}}>‹ السابق</button><button className="btn btn-pink" onClick={()=>setPhoneIdx(i=> (i+1)%7)} style={{cursor:'pointer'}}>التالي ›</button></div>
          </div>
        </div>
      </div>
    </section>

    <section id="api" style={{maxWidth:1100,margin:'18px auto',padding:'0 16px'}}>
      <div className="card" style={{padding:18}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}><h2 style={{fontSize:24}}>API Playground</h2><button className="btn btn-pink" onClick={doTry} style={{cursor:'pointer'}}>{trying?'... يجرب':'جرّب GET /kittens حقيقي →'}</button></div>
        <div style={{display:'grid',gridTemplateColumns:'1.1fr .9fr',gap:14,marginTop:14}} className="two">
          <div style={{display:'grid',gap:8}}>{ENDPOINTS.map(e=>(<div key={e.p} style={{display:'flex',gap:10,alignItems:'center',padding:'10px 12px',borderRadius:14,background:e.a==='auth'?'#FFF7ED':'white',border:'1px solid #eee'}}><span className="mono" style={{fontSize:11,fontWeight:800,padding:'4px 8px',borderRadius:999,background:e.m==='GET'?'#DCFCE7':'#DBEAFE',color:e.m==='GET'?'#166534':'#1E40AF'}}>{e.m}</span><span className="mono" style={{fontSize:12,fontWeight:700}}>{e.p}</span><span style={{marginLeft:'auto',fontSize:12,padding:'3px 8px',borderRadius:999,background:e.a==='auth'?'#FF6B6B':'#E5E7EB',color:e.a==='auth'?'white':'#374151'}}>{e.a==='auth'?'🔒 auth':'🌍 public'}</span></div>))}</div>
          <div className="card" style={{padding:14,background:'#0B0B0B',color:'#E5E7EB',overflow:'auto'}}><div className="mono" style={{fontSize:11,opacity:.6}}>RESPONSE — {apiLive ? (Array.isArray(apiLive)?`${apiLive.length} items`:apiLive) : 'اضغط "جرّب" فوق'}</div><pre className="mono" style={{marginTop:8,fontSize:11,whiteSpace:'pre-wrap',wordBreak:'break-word',lineHeight:1.5}}>{apiLive===null?`// اضغط الزر وشوف بيانات حقيقية من Laravel\n// http://localhost:8000/api/kittens\n`:apiLive==='offline'?`// السيرفر غير شغال\n// شغّله: php artisan serve`:JSON.stringify(apiLive,null,2)}</pre></div>
        </div>
      </div>
    </section>

    <section style={{maxWidth:1100,margin:'18px auto',padding:'0 16px',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}} className="three">
      {[{t:'users',c:'#FF6B6B',rows:['id','name','email','password (hashed)','created_at']},{t:'kittens',c:'#4ECDC4',rows:['id','name (ar)','breed','age','description','price','image_url']},{t:'favorites',c:'#FFD93D',rows:['id','user_id → users','kitten_id → kittens','unique(user,kitten)']}].map(tbl=>(
        <div key={tbl.t} className="card" style={{padding:14,borderTop:`3px solid ${tbl.c}`}}><div className="mono" style={{fontWeight:800}}>{tbl.t}</div><div style={{marginTop:8,display:'grid',gap:6}}>{tbl.rows.map(r=>(<div key={r} style={{display:'flex',gap:8,alignItems:'center',fontSize:12,background:'#FAFAF9',padding:'7px 8px',borderRadius:10,border:'1px solid #eee'}}><span style={{width:6,height:6,borderRadius:999,background:tbl.c}}/> {r}</div>))}</div></div>
      ))}
    </section>

    <footer style={{maxWidth:1100,margin:'18px auto 40px',padding:'0 16px'}}><div className="card" style={{padding:16,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}><span style={{fontWeight:700}}>🐱 مشمش — مشروع موبايل نهائي</span><span className="mono" style={{fontSize:12,opacity:.6}}>Flutter • Laravel • SQLite · 1980 lines · 12 kittens · made for demo</span></div></footer>
  </div>)
}

function FlowSteps({idx,setIdx}){
  const steps=[
    {t:'Splash (3s)',d:'يفحص SharedPreferences: onboarding_done؟ token؟ يقرر المسار',c:'#FFF7ED',code:'Future.delayed(3s) → prefs.getBool(onboarding_done)'},
    {t:'Onboarding 1 — تعريف',d:'شعار + اسم التطبيق + نبذة',c:'#E0F2FE',code:'PageView + indicator dots'},
    {t:'Onboarding 2 — خدمات',d:'تصفح، حفظ المفضلة، تبني',c:'#DCFCE7',code:'PageView page 2'},
    {t:'Onboarding 3 — ترحيب',d:'زر ابدأ الآن → يحفظ prefs',c:'#FEF3C7',code:'prefs.setBool(onboarding_done,true) → Login'},
    {t:'Auth — دخول/تسجيل/نسيت',d:'validation + إظهار الباسورد + روابط',c:'#FFE4E6',code:'ApiService.login(email,password) → token'},
    {t:'Home — Grid',d:'GET /api/kittens → 12 بطاقة + Detail + تبني dialog',c:'#DCFCE7',code:'FutureBuilder → GridView.count(2)'},
    {t:'Profile — خروج',d:'يعرض user + logout يمسح token → Login',c:'#F3F4F6',code:'ApiService.logout() → clearToken()'},
  ]
  const s=steps[idx%7]
  return (<div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{steps.map((_,i)=>(<button key={i} onClick={()=>setIdx(i)} style={{padding:'6px 10px',borderRadius:999,border:'1px solid #e5e7eb',background:i===idx?'#FF6B6B':'white',color:i===idx?'white':'#111',fontSize:12,fontWeight:700,cursor:'pointer'}}>{i+1}</button>))}</div><div className="card" style={{marginTop:12,padding:16,background:s.c,border:'1px solid rgba(0,0,0,.06)'}}><div style={{fontWeight:800}}>{idx+1}. {s.t}</div><div style={{fontSize:13,opacity:.7,marginTop:4,lineHeight:1.6}}>{s.d}</div><div className="mono" style={{marginTop:8,fontSize:11,background:'white',padding:'8px 10px',borderRadius:10,border:'1px solid #eee'}}>{s.code}</div></div></div>)
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
